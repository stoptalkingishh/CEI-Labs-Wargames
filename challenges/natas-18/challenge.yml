name: "Natas 18 -> 19: Predictable Numeric Sessions"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Assess the risk of a small predictable session identifier space.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8018/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas18` with the flag from Natas 17 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas18:<flag from Natas 17>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The service desk identifies sessions with a bounded numeric cookie.

  **Commands you may need:** `curl`
value: 1100
