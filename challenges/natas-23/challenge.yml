name: "Natas 23 -> 24: Toy Numeric Prefix Comparison"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Contrast a bounded numeric-prefix compatibility check with strict comparison.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8023/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas23` with the flag from Natas 22 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas23:<flag from Natas 22>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The training console displays the result of a toy compatibility check alongside a strict control.

  **Commands you may need:** `curl`
