name: "Natas 32 -> 33: Fixed Command Emulator"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Reason about command-like input without running an interpreter or process.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8032/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas32` with the flag from Natas 31 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas32:<flag from Natas 31>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Use the documented fixed command label that maps to the local debrief output.

  **Commands you may need:** `curl`
