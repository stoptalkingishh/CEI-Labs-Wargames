name: "Natas 29 -> 30: Virtual Command Catalog"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Separate filename interpretation from actual command execution.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8029/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas29` with the flag from Natas 28 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas29:<flag from Natas 28>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Use the parser's compact filename/catalog grammar against its fixed virtual catalog.

  **Commands you may need:** `curl`
