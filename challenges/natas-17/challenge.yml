name: "Natas 17 -> 18: Timing Response Oracle"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Measure an application-layer timing difference without relying on response content.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8017/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas17` with the flag from Natas 16 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas17:<flag from Natas 16>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The verifier gives one message for every candidate; compare repeated, bounded measurements.

  **Commands you may need:** `curl`
