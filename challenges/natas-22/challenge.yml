name: "Natas 22 -> 23: Redirect Execution Mismatch"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Recognize that a redirect does not necessarily stop server-side response generation.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8022/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas22` with the flag from Natas 21 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas22:<flag from Natas 21>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The local dispatch route returns a redirect and a no-store response body. Compare both response behaviors.

  **Commands you may need:** `curl`
