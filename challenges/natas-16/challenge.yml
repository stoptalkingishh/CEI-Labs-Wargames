name: "Natas 16 -> 17: Denylist Search Emulator"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Understand why command-like denylist filtering is not a safe design.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8016/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas16` with the flag from Natas 15 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas16:<flag from Natas 15>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Study the bounded archive search behavior and find the training record the adapter exposes.

  **Commands you may need:** `curl`
