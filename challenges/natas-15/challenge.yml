name: "Natas 15 -> 16: Boolean Response Oracle"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Recover a credential through a constrained boolean validation oracle.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8015/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas15` with the flag from Natas 14 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas15:<flag from Natas 14>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The validation console accepts a narrow account predicate and reveals only whether a matching record exists.

  **Commands you may need:** `curl`
