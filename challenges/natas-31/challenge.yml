name: "Natas 31 -> 32: Virtual Multipart Artifact"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Distinguish legacy multipart ambiguity from a bounded modern artifact selection model.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8031/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas31` with the flag from Natas 30 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas31:<flag from Natas 30>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Select the assigned virtual artifact by its allowlisted name; no file upload or path resolution exists.

  **Commands you may need:** `curl`
