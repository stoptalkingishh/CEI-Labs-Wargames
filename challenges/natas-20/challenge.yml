name: "Natas 20 -> 21: Delimited Session Record"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Identify how ambiguous custom record serialization can alter local state.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8020/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas20` with the flag from Natas 19 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas20:<flag from Natas 19>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The profile desk saves a short note in a compact local record. State persists only for this instance until reset.

  **Commands you may need:** `curl`
