name: "Natas 21 -> 22: Cross-Route Session Trust"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Assess trust boundaries between separately routed internal applications.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8021/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas21` with the flag from Natas 20 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas21:<flag from Natas 20>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Use the office's two local routes and observe how a desk-issued badge is trusted by reports.

  **Commands you may need:** `curl`
