name: "Natas 33 -> 34: Inert Upload Registry"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Identify the metadata trust boundary in a benign, non-executable artifact lifecycle.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8033/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas33` with the flag from Natas 32 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas33:<flag from Natas 32>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  Record the named report with its reviewed archive metadata; no upload bytes are stored.

  **Commands you may need:** `curl`
