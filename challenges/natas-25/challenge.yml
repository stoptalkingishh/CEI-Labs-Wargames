name: "Natas 25 -> 26: Synthetic Audit Resolver"
author: "CEI Labs (self-hosted recreation of OverTheWire's Natas)"
category: "Web Security"
description: |
  ## Goal
  Trace controlled marker data through a synthetic audit resolver.

  ---

  ### Get there
  1. Launch the environment and open your **attacker workstation** (noVNC, or SSH if the platform supplied credentials) from the launch panel — everything below happens inside it, not on your own machine.
  2. Browse to `http://<target-host>:8025/`, where `<target-host>` is the **Target** value in that panel (NOT the **Host** field — that one is only for SSH-ing into the attacker itself).
  3. Log in as `natas25` with the flag from Natas 24 as your password.

  > **Using curl?** Authenticate every request: `curl -u 'natas25:<flag from Natas 24>' ...`. A bare request gets `401 Unauthorized` before it reaches the level.

  ### The task
  The audit console resolves only named in-memory fixtures and keeps a bounded local request counter.

  **Commands you may need:** `curl`
