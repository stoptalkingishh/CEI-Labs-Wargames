version: 2

updates:
  # All CI actions are pinned to full commit SHAs (see .github/workflows/).
  # Dependabot will propose digest bumps that preserve the pinned-SHA style;
  # it will never rewrite a pin to a floating tag or branch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
