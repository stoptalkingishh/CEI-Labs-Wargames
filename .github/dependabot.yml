version: 2

updates:
  # All CI actions are pinned to full commit SHAs (see .github/workflows/).
  # Dependabot will propose digest bumps that preserve the pinned-SHA style;
  # it will never rewrite a pin to a floating tag or branch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Several action pins live in the same file, so Dependabot's per-action
    # PRs collide with each other in .github/workflows/build-targets.yml and
    # each one is individually unverifiable (that workflow is
    # workflow_dispatch-only, so CI never exercises it). One grouped PR per
    # run is reviewable as a unit. Grouping does not change the SHA-pin
    # style above; the pins are still full commit SHAs.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - ci
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
