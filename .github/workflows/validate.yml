name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # Lets an operator re-run the gate on demand during an event without
  # needing to push a dummy commit or open a throwaway PR.
  workflow_dispatch:

permissions:
  contents: read

# One validation run per branch at a time. Validation is side-effect free
# (it writes only the gitignored challenges/, threadline/, sentinel/ output
# trees), so superseding an in-flight run with newer commits is always safe
# and keeps the PR queue from building redundant histories.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    # The gate builds 85 CTFd challenges and runs the full scripts/ suite;
    # a hung or pathologically slow run should fail, not burn the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install PyYAML==6.0.2
      - run: python -m compileall -q scripts targets
      - run: python scripts/build_bandit.py
      - run: python scripts/build_krypton.py
      - run: python scripts/build_natas.py
      # Sentinel is a shipped track (12 challenges, docs/tracks/sentinel) and
      # was previously never exercised here. Its output goes to the gitignored
      # /sentinel/ tree, so it does not affect check_inventory_sync.
      - run: python scripts/build_sentinel.py
      - run: python scripts/build_agent.py
      - run: python scripts/build_threadline.py
      - run: python scripts/check_inventory_sync.py
      - run: pip install requests
      - run: python -m unittest discover -s scripts -t scripts -v
      - run: python -m unittest -v test_generate_banners
        working-directory: targets/bandit/build
      - run: python -m unittest -v test_generate_banners
        working-directory: targets/krypton/build
      # Stdlib-only modules; no extra pip installs required above them.
      - run: python -m unittest -v test_krypton_tools
        working-directory: targets/krypton/build
      - run: python -m unittest -v test_banner_contract
        working-directory: targets/natas/build
      - run: python -m unittest -v test_theme_contract
        working-directory: targets/natas/build
      # These two live at the natas target root, not under build/.
      - run: python -m unittest -v test_range_foundation
        working-directory: targets/natas
      - run: python -m unittest -v test_runtime_secrets
        working-directory: targets/natas
      - run: python scripts/validate_game_stages.py
      - run: python scripts/validate_generated.py --output validation-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-manifest
          path: validation-manifest.json
          if-no-files-found: error
          # A rebuildable CI artifact -- no reason to keep it for 90 days.
          retention-days: 14
